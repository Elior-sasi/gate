name: Unstage reminders
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          r=$(curl -fsS --max-time 90 https://gatetickets.vercel.app/api/cron)
          echo "$r"
          echo "::notice title=cron::$r"
